name: Reproduce SVDF Analysis
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python reproduce.py --output-dir outputs --draws 2000
      - uses: actions/upload-artifact@v4
        with:
          name: svdf-results
          path: outputs/
