name: Reproduce SVDF Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q

      - name: Reproduce paper analysis
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python reproduce.py

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: svdf-analysis-results
          path: outputs/
